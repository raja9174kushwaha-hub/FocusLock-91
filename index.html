<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FocusLock AI: Production</title>
    <link rel="manifest" href="public/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Surgical productivity control with AI-driven distraction analysis.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display.swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'base': '#f8fafc',
              'surface': '#ffffff',
              'on-surface': '#020617',
              'muted': '#64748b',
              'stroke': '#e2e8f0',
              'accent': '#10b981',
              'on-accent': '#ffffff',
              'dark-surface': '#0f172a',
              'on-dark-surface': '#f8fafc',
            }
          }
        }
      }
    </script>
    <style>
        html, body, #root { 
          height: 100%; 
          margin: 0; 
          padding: 0;
          background-color: #f8fafc;
          overflow: hidden;
        }
        body { 
          font-family: 'Inter', sans-serif; 
          -webkit-tap-highlight-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
<script>
    // Register Service Worker for PWA Offline Support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
      });
    }
</script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom": "https://esm.sh/react-dom@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^6.22.3",
    "recharts": "https://esm.sh/recharts@^2.12.2",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
  }
}
</script>
</head>
<body class="text-on-surface">
    <div id="root"></div>
</body>
</html>
